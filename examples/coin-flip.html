<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin Flip</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
      }
      #result {
        font-size: 2em;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Coin Flip</h1>
    <button onclick="flipCoin()">Flip Coin</button>
    <div id="result"></div>

    <script>
      const storedResults = [];
      function flipCoin() {
        const result = Math.random() < 0.5 ? "Heads" : "Tails";
        storedResults.push(result);
        const updatedResults = storedResults.join(", ");

        document.getElementById("result").innerText = updatedResults;
      }

      // AC3: Add players to the game. Input field for player name and which value they represent. THEN when array of results match the number of game flips (5 or 10)
      // then display a message to user to say which players won the game.

    </script>
  </body>
</html>
