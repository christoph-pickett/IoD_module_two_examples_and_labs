<!DOCTYPE html>
<html lang="en">
  <style>
    .something {
      width: 100px;
      height: 1500px;
    }

    .child-example {
      width: 50px;
      height: 50px;
      background-color: blue;
      position: sticky;
      top: 0;
    }

    .child-example:hover {
      background-color: red;
    }
  </style>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic HTML Page</title>
  </head>
  <body>
    <h1>Welcome to My Basic HTML Page</h1>
    <p><strong>This</strong> is a simple HTML page example.</p>
    <div class="something">
      <div class="child-example">look at me</div>
    </div>
  </body>
</html>
